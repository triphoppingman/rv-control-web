app:
  title: RV Control
tabs:
  - id: power
    label: Power
    root:
      type: grid
      cols: 12
      children:
        - type: card
          title: House battery
          span: 6
          children:
            - type: dial
              label: State of charge
              low_warning_below: 15
              topic: rv/renogy
              payload_path: battery_percentage
              unit: "%"
              min: 0
              max: 100
            - type: sparkline
              label: State of charge trend
              topic: rv/renogy
              payload_path: battery_percentage
              unit: "%"
              min: 0
              max: 100
              history_points: 120
              sample_interval_ms: 1000
            - type: derived
              label: PV-to-battery voltage delta
              operation: difference
              unit: V
              inputs:
                - topic: rv/renogy
                  payload_path: pv_voltage
                - topic: rv/renogy
                  payload_path: battery_voltage
        - type: card
          title: Solar input
          span: 6
          children:
            - type: dial
              label: PV voltage
              topic: rv/renogy
              payload_path: pv_voltage
              unit: V
              min: 0
              max: 150
              decimals: 1
              show_warning: false
            - type: numeric
              label: PV current
              topic: rv/renogy
              payload_path: pv_current
              unit: A
              decimals: 2
            - type: numeric
              label: PV power
              topic: rv/renogy
              payload_path: pv_power
              unit: W
  - id: shore
    label: Shore Power
    root:
      type: grid
      cols: 12
      children:
        - type: card
          title: Shore supply
          span: 6
          children:
            - type: gauge
              label: Line voltage
              topic: rv/hughes
              payload_path: voltage
              unit: V
              min: 0
              max: 150
              decimals: 1
            - type: numeric
              label: Current
              topic: rv/hughes
              payload_path: current
              unit: A
              decimals: 2
            - type: sparkline
              label: Power trend
              topic: rv/hughes
              payload_path: power
              unit: W
              min: 0
              max: 1000
              history_points: 120
              sample_interval_ms: 2000
        - type: card
          title: Protection and usage
          span: 6
          children:
            - type: numeric
              label: Error code
              topic: rv/hughes
              payload_path: error_code
              decimals: 0
            - type: numeric
              label: Energy
              topic: rv/hughes
              payload_path: energy
              unit: kWh
              decimals: 3
  - id: coach
    label: Coach
    root:
      type: column
      children:
        - type: card
          title: Tank Levels
          children:
            - type: grid
              cols: 5
              children:
                - type: tank
                  label: Fresh water
                  span: 1
                  topic: rv/coach/entity/fresh_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: Gray
                  span: 1
                  topic: rv/coach/entity/gray_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: Black
                  span: 1
                  topic: rv/coach/entity/black_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: Black 2
                  span: 1
                  topic: rv/coach/entity/black2_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: LPG
                  span: 1
                  topic: rv/coach/entity/lpg_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 10
                  decimals: 0
        - type: card
          title: Lights
          children:
            - type: grid
              cols: 3
              children:
                - type: card
                  title: Entry
                  span: 1
                  children:
                    - type: light
                      label: Cargo
                      topic: rv/coach/entity/cargo_light
                      payload_path: state
                      controls:
                        - {id: cargo_light_toggle, target: cargo_light, action: toggle, label: Toggle}
                        - {id: cargo_light_on, target: cargo_light, action: on, label: Turn on}
                        - {id: cargo_light_off, target: cargo_light, action: off, label: Turn off}
                    - type: light
                      label: Step
                      topic: rv/coach/entity/step_light
                      payload_path: state
                      controls:
                        - {id: step_light_toggle, target: step_light, action: toggle, label: Toggle}
                        - {id: step_light_on, target: step_light, action: on, label: Turn on}
                        - {id: step_light_off, target: step_light, action: off, label: Turn off}
                    - type: light
                      label: Awning
                      topic: rv/coach/entity/awning_light
                      payload_path: state
                      controls:
                        - {id: awning_light_toggle, target: awning_light, action: toggle, label: Toggle}
                        - {id: awning_light_on, target: awning_light, action: on, label: Turn on}
                        - {id: awning_light_off, target: awning_light, action: off, label: Turn off}
                - type: card
                  title: Main
                  span: 1
                  children:
                    - type: light
                      label: Living Ceiling
                      topic: rv/coach/entity/living_ceiling_light
                      payload_path: state
                      controls:
                        - {id: living_ceiling_light_toggle, target: living_ceiling_light, action: toggle, label: Toggle}
                        - {id: living_ceiling_light_on, target: living_ceiling_light, action: on, label: Turn on}
                        - {id: living_ceiling_light_off, target: living_ceiling_light, action: off, label: Turn off}
                    - type: light
                      label: Hall
                      topic: rv/coach/entity/hall_light
                      payload_path: state
                      controls:
                        - {id: hall_light_toggle, target: hall_light, action: toggle, label: Toggle}
                        - {id: hall_light_on, target: hall_light, action: on, label: Turn on}
                        - {id: hall_light_off, target: hall_light, action: off, label: Turn off}
                    - type: light
                      label: Dinette
                      topic: rv/coach/entity/dinette_light
                      payload_path: state
                      controls:
                        - {id: dinette_light_toggle, target: dinette_light, action: toggle, label: Toggle}
                        - {id: dinette_light_on, target: dinette_light, action: on, label: Turn on}
                        - {id: dinette_light_off, target: dinette_light, action: off, label: Turn off}
                    - type: light
                      label: Kitchen
                      topic: rv/coach/entity/kitchen_light
                      payload_path: state
                      controls:
                        - {id: kitchen_light_toggle, target: kitchen_light, action: toggle, label: Toggle}
                        - {id: kitchen_light_on, target: kitchen_light, action: on, label: Turn on}
                        - {id: kitchen_light_off, target: kitchen_light, action: off, label: Turn off}
                    - type: light
                      label: Sofa
                      topic: rv/coach/entity/sofa_light
                      payload_path: state
                      controls:
                        - {id: sofa_light_toggle, target: sofa_light, action: toggle, label: Toggle}
                        - {id: sofa_light_on, target: sofa_light, action: on, label: Turn on}
                        - {id: sofa_light_off, target: sofa_light, action: off, label: Turn off}
                    - type: light
                      label: Accent
                      topic: rv/coach/entity/accent_light
                      payload_path: state
                      controls:
                        - {id: accent_light_toggle, target: accent_light, action: toggle, label: Toggle}
                        - {id: accent_light_on, target: accent_light, action: on, label: Turn on}
                        - {id: accent_light_off, target: accent_light, action: off, label: Turn off}
                - type: card
                  title: Rear
                  span: 1
                  children:
                    - type: light
                      label: Bedroom ceiling
                      topic: rv/coach/entity/bedroom_ceiling_light
                      payload_path: state
                      controls:
                        - {id: bedroom_ceiling_light_toggle, target: bedroom_ceiling_light, action: toggle, label: Toggle}
                        - {id: bedroom_ceiling_light_on, target: bedroom_ceiling_light, action: on, label: Turn on}
                        - {id: bedroom_ceiling_light_off, target: bedroom_ceiling_light, action: off, label: Turn off}
                    - type: light
                      label: Rear Bath
                      topic: rv/coach/entity/rear_bath_light
                      payload_path: state
                      controls:
                        - {id: rear_bath_light_toggle, target: rear_bath_light, action: toggle, label: Toggle}
                        - {id: rear_bath_light_on, target: rear_bath_light, action: on, label: Turn on}
                        - {id: rear_bath_light_off, target: rear_bath_light, action: off, label: Turn off}
                    - type: light
                      label: Mid Bath
                      topic: rv/coach/entity/mid_bath_light
                      payload_path: state
                      controls:
                        - {id: mid_bath_light_toggle, target: mid_bath_light, action: toggle, label: Toggle}
                        - {id: mid_bath_light_on, target: mid_bath_light, action: on, label: Turn on}
                        - {id: mid_bath_light_off, target: mid_bath_light, action: off, label: Turn off}
                    - type: light
                      label: Vanity
                      topic: rv/coach/entity/vanity_light
                      payload_path: state
                      controls:
                        - {id: vanity_light_toggle, target: vanity_light, action: toggle, label: Toggle}
                        - {id: vanity_light_on, target: vanity_light, action: on, label: Turn on}
                        - {id: vanity_light_off, target: vanity_light, action: off, label: Turn off}
        - type: card
          title: Fans
          children:
            - type: grid
              cols: 3
              children:
                - type: fan
                  label: Kitchen
                  span: 1
                  topic: rv/coach/entity/kitchen_fan
                  payload_path: state
                  lid_topic: rv/coach/entity/kitchen_fan_lid
                  lid_payload_path: state
                  controls:
                    - {id: kitchen_fan_start, target: kitchen_fan, action: on, label: Start}
                    - {id: kitchen_fan_stop, target: kitchen_fan, action: off, label: Stop}
                    - {id: kitchen_fan_lid_raise, target: kitchen_fan_lid, action: open, label: Raise lid, confirm: true}
                    - {id: kitchen_fan_lid_lower, target: kitchen_fan_lid, action: close, label: Lower lid, confirm: true}
                - type: fan
                  label: Mid Bath
                  span: 1
                  topic: rv/coach/entity/mid_bath_fan
                  payload_path: state
                  controls:
                    - {id: mid_bath_fan_start, target: mid_bath_fan, action: on, label: Start}
                    - {id: mid_bath_fan_stop, target: mid_bath_fan, action: off, label: Stop}
                - type: fan
                  label: Rear Bath
                  span: 1
                  topic: rv/coach/entity/rear_bath_fan
                  payload_path: state
                  controls:
                    - {id: rear_bath_fan_start, target: rear_bath_fan, action: on, label: Start}
                    - {id: rear_bath_fan_stop, target: rear_bath_fan, action: off, label: Stop}
        - type: card
          title: Generator
          children:
            - type: generator
              label: Generator status
              topic: rv/coach/entity/generator
              payload_path: state
              controls:
                - {id: generator_start, target: generator, action: start, label: Start generator, confirm: true}
                - {id: generator_stop, target: generator, action: stop, label: Stop generator, confirm: true}
        - type: card
          title: Climate
          children:
            - type: grid
              cols: 2
              children:
                - type: thermostat
                  label: Front A/C
                  topic: rv/coach/entity/front_ac
                  payload_path: state
                  controls:
                    - {id: front_ac_cool, target: front_ac, action: cool, label: Cool}
                    - {id: front_ac_heat, target: front_ac, action: heat, label: Heat}
                    - {id: front_ac_off, target: front_ac, action: off, label: Off}
                    - {id: front_ac_fan_auto, target: front_ac, action: fan_auto, label: Auto}
                    - {id: front_ac_fan_high, target: front_ac, action: fan_high, label: High}
                    - {id: front_ac_fan_low, target: front_ac, action: fan_low, label: Low}
                    - {id: front_ac_setpoint_down, target: front_ac, action: setpoint_down, label: Decrease set point}
                    - {id: front_ac_setpoint_up, target: front_ac, action: setpoint_up, label: Increase set point}
                - type: thermostat
                  label: Rear A/C
                  topic: rv/coach/entity/rear_ac
                  payload_path: state
                  controls:
                    - {id: rear_ac_cool, target: rear_ac, action: cool, label: Cool}
                    - {id: rear_ac_off, target: rear_ac, action: off, label: Off}
                    - {id: rear_ac_fan_high, target: rear_ac, action: fan_high, label: High}
                    - {id: rear_ac_fan_low, target: rear_ac, action: fan_low, label: Low}
                    - {id: rear_ac_setpoint_down, target: rear_ac, action: setpoint_down, label: Decrease set point}
                    - {id: rear_ac_setpoint_up, target: rear_ac, action: setpoint_up, label: Increase set point}
  - id: obd2
    label: OBD2
    root:
      type: grid
      cols: 12
      children:
        - type: card
          title: Primary Instruments
          span: 6
          children:
            - type: flow
              gap: 16
              children:
                - type: dial
                  label: Engine speed
                  topic: rv/obd
                  payload_path: rpm
                  unit: RPM
                  min: 0
                  max: 4000
                  decimals: 0
                  min_width: 220px
                - type: dial
                  label: Vehicle speed
                  topic: rv/obd
                  payload_path: speed
                  unit: MPH
                  min: 0
                  max: 100
                  decimals: 0
                  min_width: 220px
            - type: gauge
              label: Engine load
              topic: rv/obd
              payload_path: load
              unit: "%"
              min: 0
              max: 100
              decimals: 1
        - type: card
          title: Temperatures
          span: 6
          children:
            - type: flow
              gap: 16
              children:
                - type: dial
                  label: Coolant
                  topic: rv/obd
                  payload_path: coolant_temp
                  unit: "°F"
                  min: 100
                  max: 260
                  decimals: 1
                  min_width: 180px
                - type: dial
                  label: Transmission fluid
                  topic: rv/obd
                  payload_path: tft
                  unit: "°F"
                  min: 100
                  max: 260
                  decimals: 1
                  min_width: 180px
                - type: numeric
                  label: Intake air
                  topic: rv/obd
                  payload_path: iat
                  unit: "°F"
                  decimals: 1
                  min_width: 180px
                - type: numeric
                  label: Ambient air
                  topic: rv/obd
                  payload_path: ambient
                  unit: "°F"
                  decimals: 1
                  min_width: 180px
        - type: card
          title: Engine and transmission
          span: 12
          children:
            - type: flow
              gap: 16
              children:
                - type: dial
                  label: Fuel level
                  low_warning_below: 15
                  topic: rv/obd
                  payload_path: fuel
                  unit: "%"
                  min: 0
                  max: 100
                  decimals: 1
                  min_width: 200px
                - type: numeric
                  label: Barometric pressure
                  topic: rv/obd
                  payload_path: baro
                  unit: bar
                  decimals: 2
                  min_width: 200px
                - type: numeric
                  label: Control module voltage
                  topic: rv/obd
                  payload_path: volt
                  unit: V
                  decimals: 2
                  min_width: 200px
                - type: numeric
                  label: Gear
                  topic: rv/obd
                  payload_path: gear
                  decimals: 0
                  min_width: 200px
                - type: numeric
                  label: Torque converter clutch (raw)
                  topic: rv/obd
                  payload_path: tcc
                  decimals: 0
                  min_width: 200px