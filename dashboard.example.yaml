app:
  title: RV Control
tabs:
  - id: power
    label: Power
    root:
      type: grid
      cols: 12
      children:
        - type: card
          title: House battery
          span: 6
          children:
            - type: dial
              label: State of charge
              low_warning_below: 15
              topic: rv/renogy
              payload_path: battery_percentage
              unit: "%"
              min: 0
              max: 100
            - type: sparkline
              label: State of charge trend
              topic: rv/renogy
              payload_path: battery_percentage
              unit: "%"
              min: 0
              max: 100
              history_points: 120
              sample_interval_ms: 1000
            - type: derived
              label: PV-to-battery voltage delta
              operation: difference
              unit: V
              inputs:
                - topic: rv/renogy
                  payload_path: pv_voltage
                - topic: rv/renogy
                  payload_path: battery_voltage
        - type: card
          title: Solar input
          span: 6
          children:
            - type: numeric
              label: PV power
              topic: rv/renogy
              payload_path: pv_power
              unit: W
  - id: shore
    label: Shore Power
    root:
      type: grid
      cols: 12
      children:
        - type: card
          title: Shore supply
          span: 6
          children:
            - type: gauge
              label: Line voltage
              topic: rv/hughes
              payload_path: voltage
              unit: V
              min: 0
              max: 150
              decimals: 1
            - type: numeric
              label: Current
              topic: rv/hughes
              payload_path: current
              unit: A
              decimals: 2
            - type: sparkline
              label: Power trend
              topic: rv/hughes
              payload_path: power
              unit: W
              min: 0
              max: 1000
              history_points: 120
              sample_interval_ms: 2000
        - type: card
          title: Protection and usage
          span: 6
          children:
            - type: numeric
              label: Error code
              topic: rv/hughes
              payload_path: error_code
              decimals: 0
            - type: numeric
              label: Energy
              topic: rv/hughes
              payload_path: energy
              unit: kWh
              decimals: 3
  - id: coach
    label: Coach
    root:
      type: column
      children:
        - type: card
          title: Tank Levels
          children:
            - type: grid
              cols: 5
              children:
                - type: tank
                  label: Fresh water
                  span: 1
                  topic: rv/coach/entity/fresh_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: Gray
                  span: 1
                  topic: rv/coach/entity/gray_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: Black
                  span: 1
                  topic: rv/coach/entity/black_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: Black 2
                  span: 1
                  topic: rv/coach/entity/black2_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 3
                  decimals: 0
                - type: tank
                  label: LPG
                  span: 1
                  topic: rv/coach/entity/lpg_tank
                  payload_path: state.level
                  unit: "%"
                  min: 0
                  max: 100
                  segments: 10
                  decimals: 0
        - type: card
          title: Lights
          children:
            - type: grid
              cols: 3
              children:
                - type: card
                  title: Entry
                  span: 1
                  children:
                    - type: light
                      label: Cargo
                      topic: rv/coach/entity/cargo_light
                      payload_path: state
                    - type: light
                      label: Step
                      topic: rv/coach/entity/step_light
                      payload_path: state
                    - type: light
                      label: Awning
                      topic: rv/coach/entity/awning_light
                      payload_path: state
                - type: card
                  title: Main
                  span: 1
                  children:
                    - type: light
                      label: Living Ceiling
                      topic: rv/coach/entity/living_ceiling_light
                      payload_path: state
                    - type: light
                      label: Hall
                      topic: rv/coach/entity/hall_light
                      payload_path: state
                    - type: light
                      label: Dinette
                      topic: rv/coach/entity/dinette_light
                      payload_path: state
                    - type: light
                      label: Kitchen
                      topic: rv/coach/entity/kitchen_light
                      payload_path: state
                    - type: light
                      label: Sofa
                      topic: rv/coach/entity/sofa_light
                      payload_path: state
                    - type: light
                      label: Accent
                      topic: rv/coach/entity/accent_light
                      payload_path: state
                - type: card
                  title: Rear
                  span: 1
                  children:
                    - type: light
                      label: Bedroom ceiling
                      topic: rv/coach/entity/bedroom_ceiling_light
                      payload_path: state
                    - type: light
                      label: Rear Bath
                      topic: rv/coach/entity/rear_bath_light
                      payload_path: state
                    - type: light
                      label: Mid Bath
                      topic: rv/coach/entity/mid_bath_light
                      payload_path: state
                    - type: light
                      label: Vanity
                      topic: rv/coach/entity/vanity_light
                      payload_path: state
        - type: card
          title: Fans
          children:
            - type: grid
              cols: 3
              children:
                - type: fan
                  label: Kitchen
                  span: 1
                  topic: rv/coach/entity/kitchen_fan
                  payload_path: state
                  lid_topic: rv/coach/entity/kitchen_fan_lid
                  lid_payload_path: state
                - type: fan
                  label: Mid Bath
                  span: 1
                  topic: rv/coach/entity/mid_bath_fan
                  payload_path: state
                - type: fan
                  label: Rear Bath
                  span: 1
                  topic: rv/coach/entity/rear_bath_fan
                  payload_path: state
  - id: obd2
    label: OBD2
    root:
      type: grid
      cols: 12
      children:
        - type: card
          title: Primary Instruments
          span: 6
          children:
            - type: flow
              gap: 16
              children:
                - type: dial
                  label: Engine speed
                  topic: rv/obd
                  payload_path: rpm
                  unit: RPM
                  min: 0
                  max: 4000
                  decimals: 0
                  min_width: 220px
                - type: dial
                  label: Vehicle speed
                  topic: rv/obd
                  payload_path: speed
                  unit: MPH
                  min: 0
                  max: 100
                  decimals: 0
                  min_width: 220px
            - type: gauge
              label: Engine load
              topic: rv/obd
              payload_path: load
              unit: "%"
              min: 0
              max: 100
              decimals: 1
        - type: card
          title: Temperatures
          span: 6
          children:
            - type: flow
              gap: 16
              children:
                - type: dial
                  label: Coolant
                  topic: rv/obd
                  payload_path: coolant_temp
                  unit: "°F"
                  min: 100
                  max: 260
                  decimals: 1
                  min_width: 180px
                - type: dial
                  label: Transmission fluid
                  topic: rv/obd
                  payload_path: tft
                  unit: "°F"
                  min: 100
                  max: 260
                  decimals: 1
                  min_width: 180px
                - type: numeric
                  label: Intake air
                  topic: rv/obd
                  payload_path: iat
                  unit: "°F"
                  decimals: 1
                  min_width: 180px
                - type: numeric
                  label: Ambient air
                  topic: rv/obd
                  payload_path: ambient
                  unit: "°F"
                  decimals: 1
                  min_width: 180px
        - type: card
          title: Engine and transmission
          span: 12
          children:
            - type: flow
              gap: 16
              children:
                - type: dial
                  label: Fuel level
                  low_warning_below: 15
                  topic: rv/obd
                  payload_path: fuel
                  unit: "%"
                  min: 0
                  max: 100
                  decimals: 1
                  min_width: 200px
                - type: numeric
                  label: Barometric pressure
                  topic: rv/obd
                  payload_path: baro
                  unit: bar
                  decimals: 2
                  min_width: 200px
                - type: numeric
                  label: Control module voltage
                  topic: rv/obd
                  payload_path: volt
                  unit: V
                  decimals: 2
                  min_width: 200px
                - type: numeric
                  label: Gear
                  topic: rv/obd
                  payload_path: gear
                  decimals: 0
                  min_width: 200px
                - type: numeric
                  label: Torque converter clutch (raw)
                  topic: rv/obd
                  payload_path: tcc
                  decimals: 0
                  min_width: 200px