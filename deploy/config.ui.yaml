server:
  host: 0.0.0.0
  port: 8000
mqtt:
  host: host.docker.internal
  port: 1883
  client_id: mqtt-dashboard
stream:
  tick_hz: 12
  stale_after_ms: 10000
dashboard_file: ./dashboard.yaml
assets_dir: ./assets
auth:
  credentials_file: ./auth-users.yaml
  origins:
    - http://127.0.0.1:8000
  secure_cookie: false