server:
  host: 127.0.0.1
  port: 8000
mqtt:
  host: 127.0.0.1
  port: 1883
  client_id: rv-control-web
  # Set true only after enabling Coach commands and the rv-control-web policy.
  commands_enabled: false
  # Set true only after enabling Coach queries and granting refresh_states.
  queries_enabled: false
  command_client_id: rv-control-web
stream:
  tick_hz: 12
  stale_after_ms: 10000
dashboard_file: ./dashboard.yaml
assets_dir: ./assets
auth:
  credentials_file: ./auth-users.yaml
  origins:
    - http://127.0.0.1:5173
    - http://127.0.0.1:8000
  secure_cookie: false