# Only topics referenced by the selected dashboard are published.
interval_s: 1
topics:
  rv/tanks:
    interval_s: 2
    retain: true
    payload:
      fresh_level: {generator: sequence, values: [3, 2, 1, 0], hold_s: 10}
      gray_level: {generator: sequence, values: [0, 1, 2, 3], hold_s: 15}
      black_level: {generator: sequence, values: [0, 1, 2, 3], hold_s: 20}
  rv/renogy:
    payload:
      battery_percentage: {generator: sine, min: 64, max: 80, period_s: 120, decimals: 1}
      battery_voltage: {generator: sine, min: 12.9, max: 13.5, period_s: 60, decimals: 2}
      battery_current: {generator: sine, min: 2, max: 12, period_s: 40, decimals: 2}
      pv_voltage: {generator: sine, min: 18, max: 20, period_s: 60, decimals: 2}
      pv_current: {generator: sine, min: 5, max: 25, period_s: 90, decimals: 2}
      pv_power: {generator: sine, min: 100, max: 540, period_s: 90, decimals: 1}
      load_power: {generator: sequence, values: [80, 120, 240, 100], hold_s: 15}
      controller_temperature: {generator: sine, min: 74, max: 80, period_s: 120, decimals: 1}
      charging_status: {generator: sequence, values: [charging, idle], hold_s: 30}
      __device: Demo solar controller
      __client: FakeTelemetry
  rv/hughes:
    interval_s: 2
    qos: 0
    retain: true
    payload:
      line: L1
      voltage: {generator: sine, min: 118, max: 122, period_s: 60, decimals: 1}
      current: {generator: sine, min: 3.5, max: 6.5, period_s: 40, decimals: 2}
      power: {generator: sine, min: 420, max: 780, period_s: 40, decimals: 1}
      power_line_1: {generator: sine, min: 420, max: 780, period_s: 40, decimals: 1}
      power_line_2: {generator: sine, min: 300, max: 500, period_s: 60, decimals: 1}
      energy: {generator: ramp, min: 0, max: 10, period_s: 3600, decimals: 3}
      error_code: 0
  rv/wled/patio:
    payload:
      on: {generator: sequence, values: [true, false], hold_s: 30}
      bri: {generator: sine, min: 28, max: 228, period_s: 60, decimals: 0}
      transition: 7
      seg:
        - id: 0
          on: true
          bri: 128
          fx: 12
          pal: 4
          col: [[255, 96, 32], [0, 0, 0], [0, 0, 0]]
  rv/gpsd/TPV:
    interval_s: 1
    payload:
      class: TPV
      mode: 3
      lat: {generator: sine, min: 37.7740, max: 37.7760, period_s: 120, decimals: 6}
      lon: {generator: sine, min: -122.4205, max: -122.4185, period_s: 120, decimals: 6}
      track: {generator: ramp, min: 0, max: 360, period_s: 120, decimals: 1}
      alt: {generator: sine, min: 100, max: 120, period_s: 60, decimals: 1}
      speed: {generator: sine, min: 10, max: 25, period_s: 30, decimals: 1}
  rv/gpsd/SKY:
    interval_s: 1
    payload:
      class: SKY
      nSat: {generator: sine, min: 14, max: 18, period_s: 120, decimals: 0}
      uSat: {generator: sine, min: 8, max: 12, period_s: 120, decimals: 0}
      hdop: {generator: sine, min: 0.8, max: 1.4, period_s: 90, decimals: 2}
      pdop: {generator: sine, min: 1.3, max: 2.2, period_s: 90, decimals: 2}
      vdop: {generator: sine, min: 1.0, max: 1.7, period_s: 90, decimals: 2}
  rv/obd:
    interval_s: 1
    payload:
      rpm: {generator: sine, min: 1200, max: 2600, period_s: 40, decimals: 0}
      speed: {generator: sine, min: 25, max: 65, period_s: 60, decimals: 0}
      load: {generator: sine, min: 20, max: 70, period_s: 30, decimals: 1}
      coolant_temp: {generator: sine, min: 185, max: 210, period_s: 90, decimals: 1}
      tft: {generator: sine, min: 160, max: 195, period_s: 100, decimals: 1}
      baro: {generator: sine, min: 0.96, max: 1.02, period_s: 120, decimals: 2}
      iat: {generator: sine, min: 70, max: 90, period_s: 90, decimals: 1}
      fuel: {generator: ramp, min: 40, max: 60, period_s: 1800, decimals: 1}
      volt: {generator: sine, min: 13.8, max: 14.8, period_s: 60, decimals: 2}
      gear: {generator: sequence, values: [1, 2, 3, 4, 5, 6], hold_s: 10}
      ambient: {generator: sine, min: 65, max: 80, period_s: 120, decimals: 1}
      tcc: {generator: sequence, values: [0, 70], hold_s: 20}
